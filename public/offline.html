<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>TOKYO — غير متصل</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#030303;color:#fff;font-family:Arial,"Segoe UI",sans-serif}.grid{position:fixed;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:5px 5px,72px 72px}.glow{position:fixed;width:50vw;height:50vw;border-radius:999px;background:rgba(239,68,68,.16);filter:blur(90px);top:-30vw;right:-20vw}.card{position:relative;width:min(92vw,560px);padding:36px 26px;border:1px solid rgba(255,255,255,.11);border-radius:30px;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));box-shadow:0 35px 120px #000,0 0 50px rgba(239,68,68,.08);backdrop-filter:blur(18px)}img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(239,68,68,.38))}.code{margin:22px 0 0;color:#f87171;font-size:11px;font-weight:900;letter-spacing:4px}.status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 13px;border:1px solid rgba(248,113,113,.25);border-radius:999px;background:rgba(239,68,68,.09);color:#fecaca;font-size:11px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:#ef4444;box-shadow:0 0 15px #ef4444}h1{font-size:clamp(28px,7vw,46px);margin:18px 0 0;font-weight:900}p{margin:14px auto 0;max-width:420px;color:#a1a1aa;font-size:15px;line-height:1.9}button{margin-top:25px;border:0;border-radius:16px;padding:14px 26px;background:#fff;color:#050505;font-weight:900;font-size:15px;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px);background:#f87171;color:#fff}.mini{display:block;margin-top:18px;color:#52525b;font-size:10px;font-weight:900;letter-spacing:2px}
    </style>
  </head>
  <body>
    <div class="grid"></div><div class="glow"></div>
    <main class="card">
      <img src="/tokyo-logo-clean.webp" alt="TOKYO" />
      <div class="code">TOKYO OFFLINE PROTOCOL</div>
      <div class="status"><span class="dot"></span> CONNECTION LOST</div>
      <h1>الاتصال مقطوع مؤقتاً</h1>
      <p>واجهة TOKYO ما زالت جاهزة. تأكد من الإنترنت واضغط إعادة المحاولة للرجوع إلى مركز القيادة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <span class="mini">SECURE SHELL // V3</span>
    </main>
  </body>
</html>
